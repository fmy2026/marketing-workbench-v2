<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>市场情报 · 数字员工广场</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/market-intelligence.css">
</head>
<body class="mi-page">
  <header class="mi-header">
    <a class="mi-back" href="/agents" aria-label="返回数字员工广场">←</a>
    <div class="mi-heading"><span class="mi-mark" aria-hidden="true">情</span><h1>市场情报</h1></div>
    <button id="settingsButton" class="secondary-button" type="button">设置</button>
  </header>
  <main class="mi-main" id="miMain" hidden><section class="mi-workspace" id="workspace" aria-live="polite"></section></main>
  <form class="mi-composer" id="chatForm">
    <label class="mi-visually-hidden" for="messageInput">输入问题</label>
    <textarea id="messageInput" rows="1" maxlength="2000" placeholder="查看当前已采集的游戏和素材" required></textarea>
    <button id="sendButton" class="start-button" type="submit">发送</button>
  </form>
  <p class="mi-loading" id="loading" role="status">正在验证登录状态…</p>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="mi-dialog-heading"><h2 id="settingsTitle">设置</h2><button id="closeSettings" type="button" class="icon-button" aria-label="关闭设置">×</button></div>
    <details id="connectionSettingsPanel" open class="mi-setting-panel"><summary>数据连接</summary>
      <form id="connectionForm" class="mi-settings-form">
        <label for="serviceAddress">公共电脑服务地址</label><input id="serviceAddress" type="url" autocomplete="off" placeholder="http://内网 IP:8787" required>
        <label for="serviceToken">访问 Token</label><input id="serviceToken" type="password" autocomplete="off" maxlength="512" placeholder="Token">
        <label class="mi-consent"><input id="allowHttp" type="checkbox">确认使用 HTTP 只读连接</label>
        <p class="mi-small" id="tokenState"></p><p class="mi-error" id="connectionError" role="alert"></p>
        <div class="mi-dialog-actions"><button id="removeConnection" type="button" class="secondary-button" hidden>移除</button><button id="saveConnection" type="submit" class="start-button">保存</button></div>
      </form>
    </details>
    <details id="modelSettingsPanel" class="mi-setting-panel"><summary>模型配置</summary>
      <form id="modelForm" class="mi-settings-form">
        <label for="modelApiBase">API Base</label><input id="modelApiBase" type="url" autocomplete="off" placeholder="https://…/v1">
        <label for="modelName">模型名称</label><input id="modelName" type="text" autocomplete="off" maxlength="200">
        <label for="modelApiKey">API Key</label><input id="modelApiKey" type="password" autocomplete="off" maxlength="512" placeholder="留空则沿用">
        <label class="mi-consent"><input id="modelEnabled" type="checkbox">启用模型摘要</label>
        <p class="mi-small" id="modelState"></p><p class="mi-error" id="modelError" role="alert"></p>
        <div class="mi-dialog-actions"><button id="testModel" type="button" class="secondary-button">测试</button><button id="saveModel" type="submit" class="start-button">保存</button></div>
      </form>
    </details>
  </dialog>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><button id="closeDetail" type="button" class="icon-button mi-close-detail" aria-label="关闭素材详情">×</button><section id="detailContent"></section></dialog>
  <script type="module" src="/market-intelligence.mjs"></script>
</body>
</html>
